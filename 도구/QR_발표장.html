<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>발표장 QR 만들기</title>
<!-- 발표 자료 20쪽에 넣는 「발표장 QR」 그림 (2026-10-27).
     실시간 화면(site/live/index.html)과 같은 그리기(site/live/card.js)를 쓰고, 앱의 QR 읽기(jsQR)로 다시 읽어 주소가 맞는지 확인한다.
     파일로 저장은 도구\QR_발표장_만들기.ps1 이 한다. ?e=이름 : 발표마다 따로 셀 때 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>body{font-family:Pretendard,'Malgun Gothic',sans-serif;background:#eef0f3;margin:20px;} img{width:270px;display:block;} pre{white-space:pre-wrap;word-break:break-all;font-size:11px;}</style>
</head>
<body>
<div id="out"></div>
<pre id="R">만드는 중…</pre>
<script src="../site/js/vendor/jsqr.min.js"></script>
<script src="../site/live/qr.js"></script>
<script src="../site/live/card.js"></script>
<script>
(function(){
  'use strict';
  var m = /[?&]e=([a-z0-9-]{1,20})/.exec(location.search), EV = m ? m[1] : 'grad';
  function run(icon){
    var st = LIVECARD.draw(EV, icon, 300), c = st.canvas, ctx = c.getContext('2d');
    var d = ctx.getImageData(0, 0, c.width, c.height), r1 = window.jsQR(d.data, d.width, d.height);
    var sm = document.createElement('canvas'); sm.width = Math.round(c.width / 4); sm.height = Math.round(c.height / 4);
    sm.getContext('2d').drawImage(c, 0, 0, sm.width, sm.height);
    var d2 = sm.getContext('2d').getImageData(0, 0, sm.width, sm.height), r2 = window.jsQR(d2.data, d2.width, d2.height);
    var data = c.toDataURL('image/png');
    document.getElementById('out').innerHTML = '<img src="' + data + '">';
    var ok = !!(r1 && r1.data === st.url && r2 && r2.data === st.url);
    document.getElementById('R').textContent = JSON.stringify({ok: ok, url: st.url, read: r1 && r1.data, readSmall: r2 && r2.data, version: st.qr.version, data: data});
  }
  var TXT = '공대 3호관 길안내 발표장 ● LIVE 휴대폰 카메라로 찍으면 길안내 앱이 열려요 https://minjong0910.github.io/live/go.html';
  var fontReady = (document.fonts && document.fonts.load)
    ? Promise.all(['800', '700', '600', '400'].map(function(w){ return document.fonts.load(w + ' 40px Pretendard', TXT); })) : Promise.resolve();
  var timeout = new Promise(function(r){ setTimeout(r, 4000); });
  var icon = new Image();
  icon.onload = function(){ Promise.race([fontReady, timeout]).then(function(){ run(icon); }, function(){ run(icon); }); };
  icon.onerror = function(){ run(null); };
  icon.src = '../site/img/icon-192.png';
})();
</script>
</body>
</html>
