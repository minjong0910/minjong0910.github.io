<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>빌드 검사</title>
<style>
  body{background:#0E1420;color:#E6EDF5;font:13px/1.6 system-ui,"Malgun Gothic",sans-serif;margin:0;padding:16px}
  pre{white-space:pre-wrap;word-break:break-all;background:#131C2B;padding:10px;border-radius:8px}
  iframe{width:400px;height:300px;border:1px solid #2A3852;opacity:.25}
</style>
</head>
<body>
<h3>빌드 검사 — 빌드한 앱이 AI 가 아는 모든 장소를 다룰 수 있는가</h3>
<div>빌드.ps1 이 Edge 헤드리스로 이 페이지를 열고, 아래 결과 칸을 읽어 갑니다. 사람이 열어 봐도 됩니다.</div>
<pre id="R">검사 중…</pre>
<iframe id="F"></iframe>

<script>
/* 왜 이런 검사가 필요한가
   사진 폴더를 새로 만들면(예: LNG1~LNG5) AI 는 그 장소를 바로 배우지만, 앱의 여러 곳이
   그 이름을 따로 알아야 한다. 하나라도 빠지면 조용히 망가진다.
     · SCOPE.allow  — 빠지면 AI 가 그 장소로 판별하는 순간 제보가 "범위 밖"으로 거절된다 (v65 사고)
     · codeLabel    — 빠지면 사용자에게 "LNG3" 같은 코드가 그대로 보인다
     · floorOf      — 빠지면 층 추정·층 혼동 계산에서 그 장소가 사라진다
     · aidFloorOf   — 빠지면 관리자 화면에서 '기타'로 빠진다 (v73·v76 에서 고친 것)
     · aidKnownCodes — 빠지면 관리자가 그 장소를 고를 수 없다 (v75 에서 고친 것)
   이 다섯을 AI 가 아는 모든 장소에 대해 한 번에 확인한다. */
(function(){
var R = document.getElementById('R'), F = document.getElementById('F');
var t0 = Date.now(), LIMIT = 150000;

function done(res){
  R.textContent = JSON.stringify(res, null, 1);
  document.title = res.ok ? 'BUILD-CHECK-OK' : 'BUILD-CHECK-FAIL';
}

function probe(){
  var w;
  try { w = F.contentWindow; } catch(e){ return done({ok:false, error:'iframe 접근 실패 : ' + e.message}); }
  var ready = w && w.SUGAI && w.SUGAI.SCOPE && w.AIVEC_DATA && w.AIVEC_DATA.codes
              && typeof w.aidKnownCodes === 'function' && typeof w.aidFloorOf === 'function'
              && w.FLOOR_LAYOUT && w.FLOOR_LAYOUT[1];
  if(!ready){
    if(Date.now() - t0 > LIMIT) return done({ok:false, error:'앱이 ' + (LIMIT/1000) + '초 안에 준비되지 않음',
      have:{SUGAI:!!(w&&w.SUGAI), AIVEC:!!(w&&w.AIVEC_DATA), aid:!!(w&&w.aidKnownCodes)}});
    return setTimeout(probe, 500);
  }
  run(w);
}

function run(w){
  var S = w.SUGAI, A = w.AIVEC_DATA;
  var codes = [], seen = {};
  A.codes.forEach(function(c){ c = String(c).toUpperCase(); if(!seen[c]){ seen[c] = 1; codes.push(c); } });
  codes.sort();

  var known = w.aidKnownCodes(), knownSet = {};
  known.forEach(function(c){ knownSet[c] = 1; });

  var bad = { scope:[], label:[], floor:[], adminFloor:[], adminPick:[] };
  codes.forEach(function(c){
    if(!S.SCOPE.allow(c)) bad.scope.push(c);
    var lb = S.codeLabel(c);
    if(!lb || lb === c) bad.label.push(c);
    var fg = S.floorGuess([{code:c, sim:1}]);
    if(!fg || !fg.floor) bad.floor.push(c);
    if(w.aidFloorOf(c) === '기타') bad.adminFloor.push(c);
    if(!knownSet[c]) bad.adminPick.push(c);
  });

  /* 사진 수 : 이름이 같은 벡터는 한 사진이다 */
  var photos = {}; A.names.forEach(function(n){ photos[n] = 1; });

  /* ── 3D (v78~) : AI 가 아는 모든 장소가 3D 건물 위에 자리가 있는가 ──
     place3D 가 없거나 null 이면 그 장소는 길안내·확신도 지도에 나타날 수 없다.
     층이 앱의 층 계산과 다르거나 건물 윤곽 밖이면 좌표가 틀린 것이다.
     평면도에 표시가 없어 어림한 곳(exact:false)은 실패가 아니라 따로 알린다. */
  bad.place3D = []; bad.floor3D = []; bad.outside3D = [];
  var approx3D = [], kinds3D = {};
  if(typeof w.place3D !== 'function'){ bad.place3D.push('(place3D 함수 없음)'); }
  else codes.forEach(function(c){
    var p = w.place3D(c);
    if(!p){ bad.place3D.push(c); return; }
    kinds3D[p.kind] = (kinds3D[p.kind] || 0) + 1;
    if(!p.exact) approx3D.push(c);
    var fg = S.floorGuess([{code:c, sim:1}]);
    var mine = p.floor === 'B1' ? '지하 1층' : p.floor + '층';
    if(!fg || fg.floor !== mine) bad.floor3D.push(c);
    var L = w.FLOOR_LAYOUT[p.floor === 'B1' ? 1 : p.floor];
    var zMin = Math.min(L.bottomOuterZ, w.GLOBAL_BOT_Z) - 0.5, zMax = L.topOuterZ + 0.5, xMax = L.halfX + 0.5;
    if(Math.abs(p.x) > xMax || p.z < zMin || p.z > zMax) bad.outside3D.push(c);
  });

  /* 3D 에 그려진 호실 중 AI 사진이 한 장도 없는 곳 — 실패는 아니고 '사진을 더 찍을 곳' 목록 */
  var aiSet = {}; codes.forEach(function(c){ aiSet[c.replace(/-[A-Z]$/, '')] = 1; });
  var roomsNoPhoto = [];
  [1,2,3,4,5].forEach(function(lv){
    Object.keys(w.FLOOR_LAYOUT[lv].lookup).forEach(function(rc){ if(!aiSet[String(rc).toUpperCase()]) roomsNoPhoto.push(rc); });
  });

  /* ── 길찾기 그래프 (v80~) ──
     ① 그래프가 AI 가 아는 모든 장소를 아는가, 정문에서 계단 없이(엘리베이터만) 갈 수 있는가
     ② 화면 안내(buildSteps)가 사용자가 확정한 좌우(2026-09-17)와 맞는가 — 3~5층
     ③ 화면 안내와 그래프가 서로 맞는가 — 1~5층 모든 방
        · 도는 방향 : 그래프가 엘리베이터에서 걸어 나가는 쪽(+Z = 왼쪽)
        · 방이 있는 쪽 : 걷는 방향 기준 문이 있는 벽
        · '몇 번째 방' : 그래프 경로가 지나는 같은 쪽 문 수(가벽으로 나뉜 방은 하나로)
     화면 안내는 좌표 공식으로, 그래프는 경로로 따로 계산하므로 한쪽이 틀리면 여기서 어긋난다. */
  bad.graph = []; bad.reach = []; bad.turnTruth = []; bad.guideGraph = [];
  var graph = null, unlisted = [];
  var TRUTH = {   /* 엘리베이터에서 내렸을 때 기준 — 사용자 확정 (2026-09-17) */
    3:{L:[[13301,13306],[13324,13326]], R:[[13310,13322]]},
    4:{L:[[13401,13403],'KTC',[13419,13422]], R:[[13405,13417]]},
    5:{L:[[13501,13506],[13522,13524]], R:[[13508,13520]]}};
  function truthSide(lv, code){
    var t = TRUTH[lv]; if(!t) return null;
    function has(arr){ return arr.some(function(a){ return Array.isArray(a) ? (+code >= a[0] && +code <= a[1]) : a === code; }); }
    return has(t.L) ? 'L' : (has(t.R) ? 'R' : '?');
  }
  var ORD = ['첫','두','세','네','다섯','여섯','일곱','여덟','아홉','열'];
  if(!w.NAVGRAPH || typeof w.buildSteps !== 'function'){ bad.graph.push('(NAVGRAPH 또는 buildSteps 없음)'); }
  else {
    graph = w.NAVGRAPH.stats();
    codes.forEach(function(c){
      if(!w.NAVGRAPH.has(c)){ bad.graph.push(c); return; }
      var r = w.NAVGRAPH.route('GATE_MAIN', c, {noStairs:true});
      if(!r.ok) bad.reach.push(c + '(' + r.why + ')');
    });
    var saveT = w.target, saveS = w.startFloor;
    try {
      for(var lv = 1; lv <= 5; lv++){
        var L = w.FLOOR_LAYOUT[lv], ev = w.evXZ(lv);
        var cells = L.cells.filter(function(q){ return q.code; });
        var list = Object.keys(L.lookup).map(function(k){ return {kind:'room', code:k}; });
        list.push({kind:'emstair', code:'EMS' + lv}, {kind:'toilet', code:'WC' + lv});
        list.forEach(function(t){
          /* 다른 층에서 엘리베이터로 올라온 경우 — 1층은 2층에서 내려온 경우 (출입문 안내가 끼지 않게) */
          w.target = {kind:t.kind, floor:lv, code:t.kind === 'room' ? t.code : null};
          w.startFloor = (lv === 1) ? 2 : 1;
          var st = w.buildSteps();
          var turn = st.filter(function(s){ return s.type === 'turn'; })[0];
          var arr  = st.filter(function(s){ return s.type === 'arrive'; })[0];
          var gTurn = turn ? (turn.tko.indexOf('왼쪽') >= 0 ? 'L' : (turn.tko.indexOf('오른쪽') >= 0 ? 'R' : '?')) : '-';
          var r = w.NAVGRAPH.route('EV' + lv, t.code);
          if(!r.ok){ bad.guideGraph.push(t.code + ' 그래프 경로 없음'); return; }
          var pts = r.points.filter(function(p){ return p.floor === lv; });
          var cz = pts.filter(function(p){ return p.kind === 'corridor'; });
          var dz = cz.length > 1 ? Math.sign(cz[cz.length-1].z - cz[0].z) : 0;
          var nTurn = dz > 0 ? 'L' : (dz < 0 ? 'R' : '0');   /* 엘리베이터(+X)에서 나와 −X 를 보면 왼손이 +Z */
          if(gTurn !== nTurn) bad.guideGraph.push(t.code + ' 도는 방향 : 안내 ' + gTurn + ' / 그래프 ' + nTurn);
          if(t.kind !== 'room') return;
          var ts = truthSide(lv, t.code);
          if(ts === '?') unlisted.push(t.code);
          else if(ts && ts !== gTurn) bad.turnTruth.push(t.code + ' : 확정 ' + ts + ' / 안내 ' + gTurn);
          /* 방이 있는 쪽과 몇 번째 문 */
          var door = pts[pts.length-1];
          var nSide = (Math.sign(door.x) === dz) ? 'L' : 'R';   /* +Z 를 보고 걸으면 왼손이 +X */
          var lo = Math.min(ev.z, door.z) - 1e-6, hi = Math.max(ev.z, door.z) + 1e-6;
          var passed = {}, all = {};
          cells.forEach(function(q){
            if(Math.sign(q.x) !== Math.sign(door.x)) return;
            var k = q.parent || q.code;
            if(dz > 0 ? q.z > ev.z : q.z < ev.z) all[k] = 1;
            if(q.z >= lo && q.z <= hi) passed[k] = 1;
          });
          var nOrd = Object.keys(passed).length, nAll = Object.keys(all).length;
          var m = arr.tko.match(/(왼쪽|오른쪽)(에서 (\S+) 번째| 맨 끝)/);
          if(!m){ bad.guideGraph.push(t.code + ' 도착 문장을 못 읽음 : ' + arr.tko); return; }
          var gSide = m[1] === '왼쪽' ? 'L' : 'R';
          if(gSide !== nSide) bad.guideGraph.push(t.code + ' 방이 있는 쪽 : 안내 ' + gSide + ' / 그래프 ' + nSide);
          if(m[2].indexOf('맨 끝') >= 0){
            if(nOrd !== nAll) bad.guideGraph.push(t.code + ' 안내는 맨 끝 / 그래프 ' + nOrd + '번째 (그쪽 ' + nAll + '개)');
          } else {
            var gOrd = ORD.indexOf(m[3]) + 1;
            if(gOrd !== nOrd) bad.guideGraph.push(t.code + ' 차례 : 안내 ' + gOrd + ' / 그래프 ' + nOrd);
          }
        });
      }
    } finally { w.target = saveT; w.startFloor = saveS; }
  }

  /* ── 관리자 후보 평면도 (v83~) : 어느 장소가 1등으로 나와도 평면도에 점이 찍히는가 ── */
  bad.miniMap = [];
  if(typeof w.aiMiniMapHtml !== 'function') bad.miniMap.push('(aiMiniMapHtml 없음)');
  else codes.forEach(function(c){
    var html = '';
    try { html = w.aiMiniMapHtml([{code:c, sim:1}], S.codeLabel); } catch(e){ html = 'ERR ' + e.message; }
    if(html.indexOf('<circle') < 0 || html.indexOf('NaN') >= 0 || html.indexOf('undefined') >= 0) bad.miniMap.push(c);
  });

  checkB3D(w, function(b3dBad){
  bad.b3d = b3dBad;
  var fails = Object.keys(bad).filter(function(k){ return bad[k].length; });
  done({
    ok: fails.length === 0,
    secs: Math.round((Date.now() - t0)/1000),
    places: codes.length,
    photos: Object.keys(photos).length,
    vectors: A.n,
    three: typeof w.THREE === 'object',
    bad: bad,
    fails: fails,
    approx3D: approx3D,
    kinds3D: kinds3D,
    roomsNoPhoto: roomsNoPhoto,
    graph: graph,
    unlisted: unlisted
  });
  });
}

/* ── 실사 3D (v81~) : 실제로 띄워서 three.js 가 실리는가 ──
   v81 부터 실사 3D 페이지에는 three.js 대신 자리표시만 있고, 띄울 때 앱 본문 것을 채운다.
   채우는 쪽이 망가지면 실사 3D 화면만 조용히 비므로, 여기서 직접 띄워 본다.
   iframe 이 부모의 THREE 객체를 빌려 쓰면 안 된다 (자기 창에서 따로 실행해야 예전과 같다). */
function checkB3D(w, cb){
  var out = [];
  if(typeof w.mountBld3D !== 'function'){ out.push('mountBld3D 없음'); return cb(out); }
  try { w.mountBld3D(); } catch(e){ out.push('mountBld3D 오류 : ' + e.message); return cb(out); }
  var t1 = Date.now();
  (function poll(){
    var fr = w.document.getElementById('b3dFrame'), cw = null;
    try { cw = fr && fr.contentWindow; } catch(e){}
    if(cw && cw.THREE && cw.THREE.REVISION){
      if(cw.THREE === w.THREE) out.push('실사 3D 가 앱의 THREE 를 빌려 씀');
      if(fr.srcdoc.indexOf('THREE_FROM_PARENT') >= 0) out.push('자리표시가 채워지지 않음');
      return cb(out);
    }
    if(Date.now() - t1 > 30000){
      var ld = w.document.getElementById('b3dLoad');
      out.push('실사 3D 가 30초 안에 three.js 를 싣지 못함' + (ld ? ' (' + ld.textContent.trim().slice(0, 40) + ')' : ''));
      return cb(out);
    }
    setTimeout(poll, 300);
  })();
}

/* ?app=다른파일.html 로 다른 빌드를 검사할 수 있다 (검사가 실패를 잡는지 시험할 때 쓴다) */
var app = (location.search.match(/[?&]app=([^&]+)/) || [])[1] || 'index_new.html';
F.addEventListener('load', function(){ setTimeout(probe, 300); });
F.src = decodeURIComponent(app);
setTimeout(function(){ if(R.textContent === '검사 중…') probe(); }, 5000);
})();
</script>
</body>
</html>
