    mTilt.uniforms.uT.value = FREEZE != null ? 0 : tt; mTilt.uniforms.tIn.value = rtLDR.texture; pass(mTilt, null);
    if(FREEZE != null && ready.photo && ++frozen >= 3 && document.title !== 'G-READY') document.title = 'G-READY';
    requestAnimationFrame(frame);
  }

  /* ── 단추 ── */
  function again(){ tAcc = 0; skipped = false; }
  document.getElementById('bAgain').onclick = function(e){ e.stopPropagation(); again(); };
  var bTheme = document.getElementById('bTheme');
  bTheme.onclick = function(e){ e.stopPropagation(); dark = !dark; document.body.classList.toggle('dark', dark); bTheme.textContent = dark ? '밝게' : '어둡게'; paint(); };
  var bSlow = document.getElementById('bSlow');
  bSlow.onclick = function(e){ e.stopPropagation(); slow = slow === 1 ? 3 : 1; bSlow.classList.toggle('on', slow !== 1); again(); };
  stage.addEventListener('click', function(){ if(tAcc < DUR.end){ skipped = true; tAcc = DUR.end; } else again(); });
  bTheme.textContent = dark ? '밝게' : '어둡게';
  window.addEventListener('resize', resize);
  paint(); resize(); requestAnimationFrame(frame);
})();
</script>
</body></html>
