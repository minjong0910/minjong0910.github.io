<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0F16">
<title>공대 3호관 길안내 — 말로 찾기 견본 3</title>
<!-- 견본 3 (2026-11-10 사용자) : 견본 2 + 오브 옆에 늘 떠 있는 말풍선 「눌러서 목적지를 말해주세요.」 — 다른 글씨를 가리지 않는 자리에.
     견본 2 (2026-11-10 사용자) : 「따로 말로 찾기 페이지가 아니라 우리 앱 첫 페이지 아래에 오브만 넣어 줘」
     실제 앱(../../)을 화면 가득 그대로 띄우고, 그 안에 voice.js 하나만 끼워 넣는다 — 실제 앱 파일은 그대로다.
     음성 인식은 이 바깥 창(맨 위)의 브라우저 기능으로 한다(__VS_HOST) — 틀 안 마이크를 막는 브라우저가 있어서. -->
<style>
  html,body{ margin:0; height:100%; background:#0B0F16; overflow:hidden; }
  iframe{ display:block; border:0; width:100%; height:100%; height:100dvh; }
</style>
</head>
<body>
<iframe id="app" src="../../index.html" allow="microphone; camera; clipboard-write" title="공대 3호관 길안내"></iframe>
<script>
window.__VS_HOST = true;
(function(){
  var f = document.getElementById('app');
  /* 앱이 스스로 새로 고칠 때(새 판 등)마다 다시 끼워 넣는다 */
  f.addEventListener('load', function(){
    try{
      var d = f.contentDocument; if(!d || d.getElementById('vsScript')) return;
      var s = d.createElement('script'); s.id = 'vsScript';
      s.src = new URL('voice.js?v=3', location.href).href;
      d.body.appendChild(s);
    }catch(e){ console.warn('말로 찾기 견본을 붙이지 못했습니다', e); }
  });
})();
</script>
</body>
</html>
