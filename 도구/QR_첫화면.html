<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>앱 첫 화면 QR 만들기</title>
<!-- 발표 시험용 「앱 첫 화면」 QR (2026-11-11 사용자 「현재 위치 문으로 설정되는 것 말고, 우리 앱 첫 페이지로 소개하는 QR」)
     QR 내용 = 사이트 기본 주소 https://minjong0910.github.io/ (출입문 QR 의 ?gate= 이 없다 → 찍으면 첫 화면, 출발 문은 정하지 않음)
     모양은 출입문 QR 스티커(QR_만들기.html)와 같은 틀 — 위 띠만 앱 단추 색(청록 → 보라), 큰 글씨는 「앱 첫 화면」.
     만든 뒤 앱이 쓰는 QR 읽기(jsQR)로 다시 읽어(원래 크기 · 1/4 크기) 주소가 그대로이고 출입문 QR 로 읽히지 않을 때만 통과.
     파일로 저장은 도구\QR_첫화면_만들기.ps1 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
  body{font-family:Pretendard,'Malgun Gothic',sans-serif;background:#eef0f3;margin:20px;color:#141820;}
  img{width:300px;display:block;background:#fff;}
  pre#R{white-space:pre-wrap;word-break:break-all;font-size:11px;}
</style>
</head>
<body>
<div id="out"></div>
<pre id="R">만드는 중…</pre>
<script src="../site/js/vendor/jsqr.min.js"></script>
<script src="../site/js/app/qrnav.js"></script>
<script src="QR_encode.js"></script>
<script>
(function(){
  'use strict';
  var DPI = 300;
  function mm(v){ return Math.round(v * DPI / 25.4); }
  var SW = mm(90), SH = mm(120);
  var URL0 = QRNAV.payload('MAIN').split('?')[0];          // 앱의 SITE_URL 그대로 — https://minjong0910.github.io/
  var out = {ok:false};

  function rr(ctx, x, y, w, h, r){
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function center(ctx, text, y, font, color){
    ctx.font = font; ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(text, SW / 2, y);
  }
  function card(icon){
    var cv = document.createElement('canvas'); cv.width = SW; cv.height = SH;
    var c = cv.getContext('2d'), pad = mm(4);
    var grad = c.createLinearGradient(pad, 0, SW - pad, 0); grad.addColorStop(0, '#00C8E6'); grad.addColorStop(1, '#7C5CFF');
    c.fillStyle = '#FFFFFF'; c.fillRect(0, 0, SW, SH);
    c.lineWidth = mm(1.2); c.strokeStyle = grad; rr(c, pad, pad, SW - 2 * pad, SH - 2 * pad, mm(4)); c.stroke();
    /* 위 띠 — 앱 단추 색(청록 → 보라) + 앱 아이콘 + 이름 */
    c.save(); rr(c, pad, pad, SW - 2 * pad, mm(15), mm(4)); c.fillStyle = grad; c.fill(); c.restore();
    c.fillStyle = grad; c.fillRect(pad, pad + mm(11), SW - 2 * pad, mm(4));
    var iz = mm(10), title = '공대 3호관 길안내';
    c.font = '700 ' + mm(5.2) + 'px Pretendard, "Malgun Gothic"';
    var tw = c.measureText(title).width, gap = mm(2.5), x0 = (SW - (iz + gap + tw)) / 2;
    if(icon){ c.save(); rr(c, x0, pad + mm(2.5), iz, iz, mm(2.2)); c.clip(); c.drawImage(icon, x0, pad + mm(2.5), iz, iz); c.restore(); }
    c.fillStyle = '#FFFFFF'; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(title, x0 + iz + gap, pad + mm(7.7));
    /* QR — 오류정정 H(30% 가 가려져도 읽힘), 둘레 흰 칸 4 */
    var qr = QRENC.encode(URL0, 'H');
    var cells = qr.size + 8, px = Math.floor(mm(56) / cells), full = cells * px;
    QRENC.draw(c, qr, Math.round((SW - full) / 2), pad + mm(17), px, 4);
    var y = pad + mm(17) + full;
    center(c, '앱 첫 화면', y + mm(12.5), '800 ' + mm(11) + 'px Pretendard, "Malgun Gothic"', '#141820');
    center(c, '설치 · 가입 없이 바로 열려요', y + mm(19), '600 ' + mm(4) + 'px Pretendard, "Malgun Gothic"', '#6B7585');
    center(c, '휴대폰 카메라로 찍으면 앱 첫 화면이 열려요', SH - pad - mm(9), '600 ' + mm(3.5) + 'px Pretendard, "Malgun Gothic"', '#4B5566');
    center(c, URL0, SH - pad - mm(4), '400 ' + mm(2.6) + 'px Pretendard, "Malgun Gothic"', '#AAB2BE');
    return {canvas:cv, qr:qr};
  }
  function run(icon){
    var st = card(icon), c = st.canvas.getContext('2d'), d = c.getImageData(0, 0, SW, SH);
    var r1 = window.jsQR(d.data, d.width, d.height);
    var sm = document.createElement('canvas'); sm.width = Math.round(SW / 4); sm.height = Math.round(SH / 4);
    sm.getContext('2d').drawImage(st.canvas, 0, 0, sm.width, sm.height);
    var d2 = sm.getContext('2d').getImageData(0, 0, sm.width, sm.height), r2 = window.jsQR(d2.data, d2.width, d2.height);
    var got = r1 && r1.data, got2 = r2 && r2.data;
    out = {url:URL0, read:got || null, readSmall:got2 || null, gate:got ? QRNAV.parse(got) : 'x', version:st.qr.version, level:st.qr.level,
           ok:got === URL0 && got2 === URL0 && !(got && QRNAV.parse(got)), data:st.canvas.toDataURL('image/png')};
    var im = document.createElement('img'); im.src = out.data; document.getElementById('out').appendChild(im);
    document.getElementById('R').textContent = JSON.stringify(out);
    document.title = out.ok ? 'QR 완료' : 'QR 실패';
  }
  var icon = new Image();
  var TXT = '공대 3호관 길안내 앱 첫 화면 설치 · 가입 없이 바로 열려요 휴대폰 카메라로 찍으면 앱 첫 화면이 열려요 ' + URL0;
  var fontReady = (document.fonts && document.fonts.load)
    ? Promise.all(['800', '700', '600', '400'].map(function(w){ return document.fonts.load(w + ' 40px Pretendard', TXT); }))
    : Promise.resolve();
  var timeout = new Promise(function(r){ setTimeout(r, 4000); });
  icon.onload = function(){ Promise.race([fontReady, timeout]).then(function(){ run(icon); }, function(){ run(icon); }); };
  icon.onerror = function(){ run(null); };
  icon.src = '../site/img/icon-192.png';
})();
</script>
</body>
</html>
