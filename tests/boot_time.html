<!DOCTYPE html>
<html lang="ko">
<head><meta charset="utf-8"><title>부팅 시간</title></head>
<body>
<!-- 앱을 열어 부팅 화면(.fx-boot)이 사라질 때까지 걸린 시간을 잰다.
     주소 : boot_time.html?app=../index_new.html  → #OUT 에 {"ms":…, "text":…} -->
<pre id="OUT"></pre>
<iframe id="F" style="width:390px;height:844px"></iframe>
<script>
(function(){
  var app = new URLSearchParams(location.search).get('app') || '../index_new.html';
  var F = document.getElementById('F'), t0 = performance.now(), last = '', seen = false, lastLineAt = null;
  function out(o){ document.getElementById('OUT').textContent = JSON.stringify(o); document.title = 'BOOT-DONE'; }
  /* 마지막 줄(예전 'WELCOME_' · 지금 '시작합니다')이 다 찍힌 시각 = 앱이 드러나기 시작하는 시각.
     (드러나는 효과는 requestAnimationFrame 으로 움직여서, 헤드리스 가상 시계에서는 끝나지 않을 수 있다) */
  (function poll(){
    var d = null; try { d = F.contentDocument; } catch(e){}
    var b = d && d.querySelector('.fx-boot'), l = d && d.getElementById('fxBootLog');
    if(b){ seen = true; if(l) last = l.textContent; }
    if(lastLineAt === null && /(WELCOME_|시작합니다|Starting)$/.test(last.replace(/▊$/, ''))) lastLineAt = Math.round(performance.now() - t0);
    if(lastLineAt !== null && performance.now() - t0 > lastLineAt + 1500) return out({ms: lastLineAt, text: last});
    if(seen && !b) return out({ms: lastLineAt, gone: Math.round(performance.now() - t0), text: last});
    if(performance.now() - t0 > 30000) return out({ms: null, text: last, error: '30초 안에 안 끝남'});
    setTimeout(poll, 20);
  })();
  F.src = app;
})();
</script>
</body>
</html>
