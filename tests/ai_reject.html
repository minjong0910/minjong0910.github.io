<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>AI 건물 밖 사진 측정</title>
<style>body{background:#0E1420;color:#E6EDF5;font:13px/1.6 system-ui,"Malgun Gothic",sans-serif;margin:0;padding:16px}
iframe{width:400px;height:300px;border:1px solid #2A3852;opacity:.25}</style>
</head>
<body>
<h3>AI 건물 밖 사진 측정 — 앱이 실제로 쓰는 판정(SUGAI.classify · quality)으로 한 장씩 잰다</h3>
<div>도구\AI_건물밖사진_측정.ps1 이 Edge 헤드리스로 이 페이지를 열고, 사진을 한 장씩 measure() 에 넣어 결과를 모은다. (2026-11-10 외부 점검 A-2)</div>
<pre id="R">준비 중…</pre>
<iframe id="F" src="../site/index.html"></iframe>
<script>
/* 앱을 iframe 으로 띄워 앱의 AI(같은 모델 · 같은 기준 자료 · 같은 비교 방식)를 그대로 빌려 쓴다 — 측정용으로 따로 만든 계산이 아니다. */
var F = document.getElementById('F'), R = document.getElementById('R');
window.READY = false;
(function wait(){
  var w = null; try{ w = F.contentWindow; }catch(e){}
  if(w && w.SUGAI && w.SUGAI.ensureData && w.SUGAI.classify && !wait.asked){
    wait.asked = true;
    w.SUGAI.ensureData().then(function(){ return w.SUGAI.libEnsure ? w.SUGAI.libEnsure() : null; })
      .then(function(){
        /* 모델을 한 번 미리 돌려 둔다(첫 장만 느린 것을 결과에서 빼려고) */
        var c = document.createElement('canvas'); c.width = c.height = 64;
        return w.SUGAI.classify(c.toDataURL('image/jpeg'));
      })
      .then(function(){ window.READY = true; R.textContent = '준비됨'; document.title = 'AIR-READY'; },
            function(e){ R.textContent = 'AI 자료를 준비하지 못함 : ' + e; document.title = 'AIR-FAIL'; });
  }
  if(!window.READY) setTimeout(wait, 400);
})();
window.measure = function(url){
  var w = F.contentWindow;
  return new Promise(function(res){
    var im = new Image();
    im.onload = function(){
      var q = null; try{ q = w.SUGAI.quality ? w.SUGAI.quality(im) : null; }catch(e){}
      var TH = w.SUGAI.TH || {};
      var qBad = q ? (q.sharp < TH.SHARP ? 'sharp' : q.bright < TH.DARK ? 'dark' : q.bright > TH.BRIGHT ? 'bright' : Math.max(q.w, q.h) < TH.MINPX ? 'small' : '') : '';
      w.SUGAI.classify(url).then(function(r){
        res({sim:r.sim, margin:r.margin, code:r.code, top:(r.top || []).map(function(t){ return t.code + ':' + t.sim.toFixed(3); }).join(' '),
             sharp:q ? Math.round(q.sharp) : null, bright:q ? Math.round(q.bright) : null, qBad:qBad});
      }, function(e){ res({err:String(e)}); });
    };
    im.onerror = function(){ res({err:'image'}); };
    im.src = url;
  });
};
</script>
</body>
</html>
